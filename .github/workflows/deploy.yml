name: Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Test scenario tags'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      DOCKER_REGISTRY: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_APP_NAME: ${{ secrets.DOCKER_APP_NAME }}
      DOCKER_IMAGE_TAG: latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_APP_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_APP_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOCKER_REGISTRY,DOCKER_APP_NAME,DOCKER_IMAGE_TAG
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            chmod +x infra/deploy.sh
            ./infra/deploy.sh
